 if(!isNaN(v0)){const d=v-v0;if(d>=thr){p=UP;c=C.up}else if(d<=-thr){p=DN;c=C.down}else c=C.level}
 el('polyline',{points:pl(p,400+xp,400+yp-20),fill:'none',stroke:c,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'},g)}
function face(t){const g=$('face');g.innerHTML='';if(isNaN(t))return;
 const c=t>K.HI?C.hot:t<K.LO?C.cold:C.white,sm=!(t>K.HI||t<K.LO),x=88,y=358;
 el('circle',{cx:x,cy:y,r:37.5,fill:'none',stroke:c,'stroke-width':5},g);
 for(const s of[-1,1])el('circle',{cx:x+s*14,cy:y-11,r:5,fill:c},g);
 const p=[],my=sm?y-3:y+25;for(let i=0;i<=40;i++){const a=(sm?30+i*3:215+i*2.75)*Math.PI/180;p.push([x+17.5*Math.cos(a),my+17.5*Math.sin(a)])}
 el('polyline',{points:p.map(q=>q.join(',')).join(' '),fill:'none',stroke:c,'stroke-width':5,'stroke-linecap':'round'},g)}
const PD=[[12,0],[17,9],[22,17],[22,23],[18,29],[12,31],[5,29],[1,23],[1,17],[6,9],[12,0]],PC=[[12,9],[8,16],[14,20],[9,27]];
function drop(g,i,c,cr){const ox=400-303+28*i,oy=400+16+6*(i!=1);
 el('polyline',{points:pl(PD,ox,oy),fill:'none',stroke:c,'stroke-width':4,'stroke-linejoin':'round'},g);
 if(cr)el('polyline',{points:pl(PC,ox,oy),fill:'none',stroke:c,'stroke-width':3},g)}
function drops(h){const g=$('drops');g.innerHTML='';if(isNaN(h))return;
 if(h>K.WET)for(let i=0;i<3;i++)drop(g,i,C.acc);else if(h<K.DRY)drop(g,2,C.crack,true);else drop(g,2,C.neutral)}
function lp(rows,k){const ok=rows.filter(r=>!isNaN(r[k]));if(!ok.length)return[NaN,NaN,NaN];
 const L=ok[ok.length-1];let v0=NaN,best=-1;for(const r of ok){const a=(L.t-r.t)/6e4;if(a>=10&&a<=60&&a>best){best=a;v0=r[k]}}return[L[k],v0,L.t]}
let S={};
const fmtNY=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true});
function render(){const s=S;
 if(isNaN(s.tLast)){$('upd').textContent='No recent data';$('clock').textContent='--:--'}
 else{const m=Math.max(0,Math.round((Date.now()-s.tLast)/6e4));$('upd').textContent=m<1?'Updated just now':m<120?`Updated ${m} min ago`:`Updated ${(m/60).toFixed(1)} h ago`;
  const p=Object.fromEntries(fmtNY.formatToParts(new Date(s.tLast)).map(o=>[o.type,o.value]));
  $('clock').textContent=`${p.weekday} ${p.month} ${p.day}\u00a0\u00a0\u00a0${p.hour}:${p.minute} ${p.dayPeriod}`}
 $('room').textContent=s.sim?'NS131 (SIM)':'NS131';
 $('rT').textContent=f(s.rT,1)+'°F';$('rT').setAttribute('fill',!isNaN(s.rT)&&s.rT>K.HOT?C.hot:C.white);
 $('rH').textContent=f(s.rH,0)+'%';$('oT').textContent=f(s.oT,1)+'°F';$('oH').textContent=f(s.oH,0)+'%';
 if(!isNaN(s.rT)&&!isNaN(s.rH)){face(s.rT);drops(s.rH)}else{$('face').innerHTML='';$('drops').innerHTML=''}
 trend($('aRT'),-44,-42,s.rT,s.rT60,K.DT);trend($('aRH'),-85,36,s.rH,s.rH60,K.DRH);
 trend($('aOT'),278,-42,s.oT,s.oT60,K.DT);trend($('aOH'),207,36,s.oH,s.oH60,K.DRH);
 const ok=!isNaN(s.eco2)&&!isNaN(s.tvoc);$('air').textContent=ok?`eCO2 ${Math.round(s.eco2)} ppm\u00a0\u00a0\u00a0\u00a0TVOC ${Math.round(s.tvoc)} ppb`:'eCO2 -- ppm\u00a0\u00a0\u00a0\u00a0TVOC -- ppb';$('air').setAttribute('fill',ok?C.air:C.muted);
 const d=s.rT-s.oT;$('dl').textContent=isNaN(d)?'':(d>=0?'+':'')+d.toFixed(1)+'°F vs outside';
 const st=isNaN(s.rT)?['No sensor data',C.err]:s.sim?['SIMULATED (Canton NY weather)',C.warm]:['AHT10 OK',C.ok];$('st').textContent=st[0];$('st').setAttribute('fill',st[1])}
async function getRoom(){try{const j=await (await fetch(TS,{cache:'no-store'})).json();
  const rows=(j.feeds||[]).map(e=>({t:Date.parse(e.created_at),T:num(e.field1),H:num(e.field2),E:num(e.field3),V:num(e.field4),OT:num(e.field5),OH:num(e.field6),st:e.status}));
  const a=lp(rows,'T'),b=lp(rows,'H'),c=lp(rows,'OT'),d=lp(rows,'OH');
  const tl=Math.max(...rows.map(r=>r.t).filter(isFinite));
  Object.assign(S,{rT:a[0],rT60:a[1],rH:b[0],rH60:b[1],eco2:lp(rows,'E')[0],tvoc:lp(rows,'V')[0],oT:c[0],oT60:c[1],oH:d[0],oH60:d[1],tLast:isNaN(a[2])?(isFinite(tl)?tl:NaN):a[2]});
  const L=rows[rows.length-1];S.sim=!!(L&&/SIMULATED/i.test(String(L.st||'')))}
 catch(e){S={tLast:NaN,rT:NaN,rH:NaN,oT:NaN,oH:NaN,eco2:NaN,tvoc:NaN}}}
async function getOut(){if(!isNaN(S.oT)&&!isNaN(S.oH))return;try{const j=await (await fetch(OM,{cache:'no-store'})).json();
  const ht=j.hourly.time.map(Date.parse),tg=Date.parse(j.current.time)-K.TREND*6e4;let k=0;ht.forEach((t,i)=>{if(Math.abs(t-tg)<Math.abs(ht[k]-tg))k=i});
  if(isNaN(S.oT))Object.assign(S,{oT:num(j.current.temperature_2m),oT60:num(j.hourly.temperature_2m[k])});
  if(isNaN(S.oH))Object.assign(S,{oH:num(j.current.relative_humidity_2m),oH60:num(j.hourly.relative_humidity_2m[k])})}catch(e){}}
async function tick(){await getRoom();await getOut();render()}
tick();setInterval(tick,30000);
setTimeout(function(){var u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString());},30000);
</script></body></html>
